<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-label="Mobile-ReverseSkill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1115"/><stop offset="1" stop-color="#181d25"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0913f"/><stop offset="1" stop-color="#c2701f"/>
    </linearGradient>
    <style>
      .t{font-family:"IBM Plex Sans","Segoe UI",system-ui,Arial,sans-serif}
      .m{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace}
    </style>
  </defs>

  <rect width="1280" height="300" rx="16" fill="url(#bg)"/>
  <!-- subtle signal grid -->
  <g stroke="#2a313b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="75" x2="1280" y2="75"/><line x1="0" y1="150" x2="1280" y2="150"/><line x1="0" y1="225" x2="1280" y2="225"/>
  </g>
  <rect x="4" y="4" width="1272" height="292" rx="14" fill="none" stroke="#262c34"/>
  <rect x="0" y="0" width="6" height="300" fill="url(#amber)"/>

  <!-- glyph: phone + scan brackets + magnifier -->
  <g transform="translate(96,70)">
    <rect x="0" y="0" width="150" height="164" rx="20" fill="#161a20" stroke="url(#amber)" stroke-width="3"/>
    <rect x="16" y="20" width="118" height="112" rx="6" fill="#0e1115"/>
    <line x1="58" y1="146" x2="92" y2="146" stroke="#3a424d" stroke-width="6" stroke-linecap="round"/>
    <!-- scan corners -->
    <g stroke="url(#amber)" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M28 42 L28 32 L38 32"/><path d="M112 32 L122 32 L122 42"/>
      <path d="M28 110 L28 120 L38 120"/><path d="M112 120 L122 120 L122 110"/>
    </g>
    <!-- hex hint -->
    <text x="46" y="82" class="m" font-size="20" fill="#e0913f">0x</text>
    <!-- magnifier -->
    <g transform="translate(120,116)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#e7e9ec" stroke-width="6"/>
      <line x1="22" y1="22" x2="44" y2="44" stroke="#e7e9ec" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- title -->
  <text x="322" y="132" class="t" font-size="66" font-weight="800" fill="#f4f5f7">Mobile-ReverseSkill</text>
  <text x="326" y="176" class="t" font-size="23" fill="#98a1ac">Agent skills for mobile reverse engineering · dynamic analysis · fuzzing</text>

  <!-- chips -->
  <g class="m" font-size="16" font-weight="600">
    <g transform="translate(326,206)">
      <g><rect width="104" height="34" rx="17" fill="#2b2116" stroke="#e0913f" stroke-opacity="0.5"/><text x="52" y="23" fill="#e0913f" text-anchor="middle">Android</text></g>
      <g transform="translate(116,0)"><rect width="66" height="34" rx="17" fill="#2b2116" stroke="#e0913f" stroke-opacity="0.5"/><text x="33" y="23" fill="#e0913f" text-anchor="middle">iOS</text></g>
      <g transform="translate(194,0)"><rect width="98" height="34" rx="17" fill="#1b2028" stroke="#333b45"/><text x="49" y="23" fill="#98a1ac" text-anchor="middle">Flutter</text></g>
      <g transform="translate(304,0)"><rect width="150" height="34" rx="17" fill="#1b2028" stroke="#333b45"/><text x="75" y="23" fill="#98a1ac" text-anchor="middle">React Native</text></g>
      <g transform="translate(466,0)"><rect width="80" height="34" rx="17" fill="#1b2028" stroke="#333b45"/><text x="40" y="23" fill="#98a1ac" text-anchor="middle">Frida</text></g>
      <g transform="translate(558,0)"><rect width="86" height="34" rx="17" fill="#1b2028" stroke="#333b45"/><text x="43" y="23" fill="#98a1ac" text-anchor="middle">AFL++</text></g>
    </g>
  </g>

  <!-- signal bars motif -->
  <g transform="translate(1150,60)" fill="#e0913f" opacity="0.85">
    <rect x="0" y="30" width="12" height="14" rx="2"/><rect x="20" y="20" width="12" height="24" rx="2"/>
    <rect x="40" y="8" width="12" height="36" rx="2"/><rect x="60" y="-6" width="12" height="50" rx="2" fill="#3a424d"/>
  </g>
  <text x="1210" y="250" class="m" font-size="13" fill="#5b6470" text-anchor="end">authorized testing only</text>
</svg>
